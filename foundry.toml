[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned compiler. 0.8.24's default EVM target is Shanghai, but the EVM
# version is pinned explicitly below so a compiler bump can never silently
# reintroduce Cancun opcodes.
solc = "0.8.24"
# CRITICAL (Aevum testnet constraint, kit gotcha #1): Cancun builds deploy
# and then revert at runtime with "invalid opcode: MCOPY". The Aevum EVM is
# Shanghai. Never raise this without re-verifying on chain 44005.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 512
depth = 64
# Most handler calls are expected to revert (invalid grants, over-cap pays,
# revoked keys). A revert is the correct outcome, not a failure.
fail_on_revert = false
